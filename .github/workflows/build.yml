name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install buildozer==1.5.0 cython==3.0.10

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavcodec-dev \
            libavformat-dev \
            libusb-dev \
            libudev-dev \
            pkg-config \
            zip \
            unzip \
            openjdk-17-jdk \
            libtool \
            autoconf \
            autoconf-archive \
            libltdl-dev

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 -d > keystore/fileshare.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Patch p4a for 16KB alignment
        run: python patch_p4a_16kb.py

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version
          buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fileshare-apk
          path: bin/*.apk
