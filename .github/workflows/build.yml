name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Clear Buildozer cache
        run: |
          rm -rf ~/.buildozer .buildozer

      - name: Build APK
        run: |
          buildozer android debug
        timeout-minutes: 90

      - name: Find APK files
        if: always()
        run: |
          echo "=== bin 目录 ==="
          ls -la bin/ 2>/dev/null || echo "bin 目录不存在"
          echo "=== 查找 APK ==="
          find $GITHUB_WORKSPACE -name "*.apk" -type f 2>/dev/null || echo "没有找到 APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fileshare-apk
          path: bin/
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: .buildozer/android/platform/build-arm64-v8a/build/installed-packages.txt
          if-no-files-found: warn
