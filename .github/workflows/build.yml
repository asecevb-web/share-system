name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Download and patch sources
        run: |
          rm -rf .buildozer ~/.buildozer
          # 第一次构建：下载源码（允许失败）
          buildozer android debug || true
          
          # === 修补源码 ===
          BUILD_DIR=".buildozer/android/platform/build-arm64-v8a/build/bootstrap_builds/sdl2"
          
          if [ -d "$BUILD_DIR" ]; then
            echo "=== 修补 SDL2: ALooper_pollAll → ALooper_pollOnce ==="
            find "$BUILD_DIR/jni/SDL" -name "*.c" -o -name "*.h" | xargs grep -l "ALooper_pollAll" 2>/dev/null | while read f; do
              sed -i 's/ALooper_pollAll/ALooper_pollOnce/g' "$f"
              echo "  已修补: $(basename $f)"
            done
            
            echo "=== 修补 harfbuzz: 关闭 cast-function-type-strict 错误 ==="
            find "$BUILD_DIR" -name "*.mk" | while read f; do
              if ! grep -q "cast-function-type-strict" "$f"; then
                sed -i '/LOCAL_CFLAGS/a LOCAL_CFLAGS += -Wno-error=cast-function-type-strict -Wno-cast-function-type-strict' "$f" 2>/dev/null
              fi
            done
            
            # 直接修改 Application.mk 添加全局编译标志
            APP_MK="$BUILD_DIR/jni/Application.mk"
            if [ -f "$APP_MK" ]; then
              echo "" >> "$APP_MK"
              echo "# 16KB alignment and compatibility fixes" >> "$APP_MK"
              echo "APP_CFLAGS += -Wno-error=cast-function-type-strict" >> "$APP_MK"
              echo "APP_LDFLAGS += -Wl,-z,max-page-size=16384" >> "$APP_MK"
              echo "已修补 Application.mk"
              cat "$APP_MK"
            fi
            
            # 修补 harfbuzz 的 hb-ft.cc 直接修改源码
            find "$BUILD_DIR" -name "hb-ft.cc" | while read f; do
              # 把 FT_Generic_Finalizer 的强转改为 reinterpret_cast 或去掉 -Werror
              sed -i 's/-Werror/-Wno-error/g' "$f" 2>/dev/null
              echo "已修补: $f"
            done
            
            # 清理编译缓存，强制重新编译
            echo "=== 清理编译缓存 ==="
            rm -rf "$BUILD_DIR/obj" "$BUILD_DIR/libs"
          fi
        timeout-minutes: 30

      - name: Build APK
        run: |
          buildozer android debug
        timeout-minutes: 90
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fileshare-apk
          path: bin/*.apk
